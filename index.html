<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Happy Janmashtami</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400&family=Jost:wght@300;400&display=swap" rel="stylesheet">
<style>
  :root{
    --dusk:#1c0c0b;
    --gold:#ffc978;
    --cream:#ffe9c9;
    --ink:#f2d9bd;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0;
    background:radial-gradient(115% 85% at 52% 30%, #8a4318 0%, #4c1d10 42%, var(--dusk) 100%);
    color:var(--ink);
    font-family:"Jost", system-ui, sans-serif;
    font-weight:300;
    overflow:hidden;
  }
  canvas{display:block;width:100%;height:100%;position:fixed;inset:0}

  .hud{
    position:fixed; inset:auto 0 0 0;
    padding:0 6vw 4.2vh;
    display:flex; flex-direction:column; align-items:center;
    text-align:center; pointer-events:none;
  }
  .greeting{
    font-family:"Cormorant Garamond", Georgia, serif;
    font-weight:300;
    font-size:clamp(2rem, 6.4vw, 3.5rem);
    line-height:1.2;
    color:var(--cream);
    margin:0;
    text-shadow:0 0 30px rgba(255,170,90,.45);
  }
  .line{
    max-width:36ch; margin:.75rem 0 0;
    font-size:clamp(.82rem, 2.6vw, .98rem);
    line-height:1.7; color:rgba(242,217,189,.72);
  }
  .hud .greeting,.hud .line{opacity:0;transform:translateY(10px);transition:opacity 1.6s ease,transform 1.6s ease}
  body.done .hud .greeting{opacity:1;transform:none}
  body.done .hud .line{opacity:1;transform:none;transition-delay:.5s}

  .controls{position:fixed;top:0;right:0;padding:2.4vh 4vw}
  button{
    font-family:inherit;font-size:.82rem;letter-spacing:.06em;
    color:rgba(255,201,120,.9);background:transparent;
    border:1px solid rgba(255,201,120,.32);border-radius:999px;
    padding:.5rem 1.05rem;cursor:pointer;
    transition:background .25s ease,border-color .25s ease,color .25s ease;
  }
  button:hover,button:focus-visible{background:rgba(255,201,120,.14);border-color:rgba(255,201,120,.65);color:var(--cream)}
  button:focus-visible{outline:2px solid #6fe0c8;outline-offset:3px}

  .hint{position:fixed;top:0;left:0;padding:2.6vh 4vw;font-size:.78rem;letter-spacing:.14em;color:rgba(242,217,189,.42)}
  @media (max-width:520px){.hint{display:none}}
</style>
</head>
<body>
<canvas id="c"></canvas>

<p class="hint">the dots are joining</p>
<div class="controls"><button id="again" type="button">Draw again</button></div>

<div class="hud">
  <h1 class="greeting">Happy Janmashtami</h1>
  <p class="line">A little Krishna, drawn one dot at a time, flute first — because that is the part everyone hears before they see him.</p>
</div>

<script>
(function(){
  "use strict";

  // groups: 1 jewel, 2 gold ornament, 3 skin line, 4 warm cloth/halo, 5 hair, 6 blush
  var FIGURE = [
    // ---- hair silhouette
    {g:5, d:"M 176 250 C 158 200 168 138 210 104 C 240 80 266 82 286 92 C 320 74 360 82 390 104 C 428 132 442 192 426 250"},
    {g:5, d:"M 190 218 C 208 178 240 160 268 174 C 290 148 322 148 346 168 C 374 156 404 176 416 216"},
    {g:5, d:"M 176 250 C 158 264 152 288 165 302 C 176 314 191 307 193 292"},
    {g:5, d:"M 426 250 C 444 264 450 288 437 302 C 426 314 411 307 409 292"},
    {g:5, d:"M 214 128 C 232 112 254 108 270 116"},
    {g:5, d:"M 336 112 C 356 108 376 118 388 134"},
    {g:5, d:"M 298 90 C 306 70 322 60 340 66"},

    // ---- crown, jewel, forehead drop
    {g:2, d:"M 264 88 C 290 62 336 52 368 66"},
    {g:2, d:"M 274 78 C 292 42 338 32 364 60"},
    {g:2, d:"M 288 74 C 300 58 316 52 330 54"},
    {g:1, d:"M 318 40 C 328 40 334 46 334 53 C 334 61 328 66 318 66 C 308 66 302 61 302 53 C 302 46 308 40 318 40 Z"},
    {g:2, d:"M 300 130 C 300 144 300 152 300 160"},
    {g:1, d:"M 300 160 C 307 160 310 168 300 176 C 290 168 293 160 300 160 Z"},

    // ---- face
    {g:3, d:"M 176 236 C 176 332 228 390 300 390 C 372 390 424 332 424 236"},
    {g:3, d:"M 222 206 C 236 192 262 190 278 200"},
    {g:3, d:"M 322 200 C 338 190 364 192 378 206"},

    // ---- big eyes
    {g:3, d:"M 256 220 C 276 220 292 239 292 262 C 292 285 276 304 256 304 C 236 304 220 285 220 262 C 220 239 236 220 256 220 Z"},
    {g:3, d:"M 344 220 C 364 220 380 239 380 262 C 380 285 364 304 344 304 C 324 304 308 285 308 262 C 308 239 324 220 344 220 Z"},
    {g:4, d:"M 244 238 C 252 238 257 244 257 251 C 257 258 252 263 244 263 C 237 263 232 258 232 251 C 232 244 237 238 244 238 Z"},
    {g:4, d:"M 332 238 C 340 238 345 244 345 251 C 345 258 340 263 332 263 C 325 263 320 258 320 251 C 320 244 325 238 332 238 Z"},
    {g:4, d:"M 266 280 C 271 280 274 283 274 287 C 274 291 271 294 266 294 C 262 294 259 291 259 287 C 259 283 262 280 266 280 Z"},
    {g:4, d:"M 354 280 C 359 280 362 283 362 287 C 362 291 359 294 354 294 C 350 294 347 291 347 287 C 347 283 350 280 354 280 Z"},

    // ---- nose, cheeks, ears
    {g:3, d:"M 294 318 C 300 325 306 325 312 318"},
    {g:6, d:"M 194 322 C 194 308 230 308 230 322 C 230 336 194 336 194 322 Z"},
    {g:6, d:"M 370 322 C 370 308 406 308 406 322 C 406 336 370 336 370 322 Z"},
    {g:2, d:"M 186 322 C 178 334 182 350 194 350"},
    {g:2, d:"M 414 322 C 422 334 418 350 406 350"},

    // ---- bansuri
    {g:2, d:"M 196 352 L 414 306"},
    {g:2, d:"M 199 364 L 417 318"},
    {g:2, d:"M 414 306 C 421 308 422 316 417 318"},

    // ---- neck and body
    {g:3, d:"M 268 386 C 270 398 270 404 268 412"},
    {g:3, d:"M 332 386 C 330 398 330 404 332 412"},
    {g:3, d:"M 268 410 C 232 418 206 442 200 476 C 194 512 200 546 210 570"},
    {g:3, d:"M 332 410 C 368 418 394 442 400 476 C 406 512 400 546 390 570"},

    // ---- necklaces
    {g:2, d:"M 246 424 C 268 448 332 448 354 424"},
    {g:2, d:"M 238 436 C 266 472 334 472 362 436"},
    {g:2, d:"M 232 448 C 264 496 336 496 368 448"},
    {g:1, d:"M 300 496 C 309 496 312 506 300 516 C 288 506 291 496 300 496 Z"},

    // ---- arms and hands on the flute
    {g:3, d:"M 214 452 C 200 486 212 508 232 500 C 250 492 246 420 252 380"},
    {g:3, d:"M 386 452 C 400 486 388 508 368 500 C 350 492 354 430 350 356"},
    {g:3, d:"M 240 366 C 240 352 268 352 268 366 C 268 380 240 380 240 366 Z"},
    {g:3, d:"M 338 330 C 338 316 366 316 366 330 C 366 344 338 344 338 330 Z"},
    {g:2, d:"M 236 384 C 244 392 264 392 272 384"},
    {g:2, d:"M 340 348 C 348 356 366 354 372 346"},
    {g:2, d:"M 208 470 C 218 480 232 478 238 468"},
    {g:2, d:"M 392 470 C 382 480 368 478 362 468"},

    // ---- dhoti
    {g:2, d:"M 212 566 C 250 580 350 580 388 566"},
    {g:4, d:"M 210 570 C 196 610 190 650 188 686"},
    {g:4, d:"M 390 570 C 404 610 410 650 412 686"},
    {g:4, d:"M 188 686 C 232 706 368 706 412 686"},
    {g:4, d:"M 258 578 C 248 618 244 654 244 690"},
    {g:4, d:"M 342 578 C 352 618 356 654 356 690"},
    {g:4, d:"M 392 580 C 442 600 472 646 456 692 C 448 716 424 720 412 706"},

    // ---- legs and anklets
    {g:3, d:"M 250 692 C 246 712 250 726 260 734"},
    {g:3, d:"M 350 692 C 354 712 350 726 340 734"},
    {g:3, d:"M 260 734 C 246 740 244 746 264 748"},
    {g:3, d:"M 340 734 C 354 740 356 746 336 748"},
    {g:2, d:"M 244 700 C 252 706 262 704 266 698"},
    {g:2, d:"M 334 698 C 340 704 350 706 356 700"},

    // ---- halo, last
    {g:4, d:"M 96 258 A 204 204 0 1 1 504 258 A 204 204 0 1 1 96 258"}
  ];

  var COLORS = {
    1:[110, 226, 190],
    2:[255, 201, 120],
    3:[160, 205, 250],
    4:[255, 150, 88],
    5:[190, 172, 255],
    6:[255, 150, 175]
  };

  var VB_W = 600, VB_H = 800;
  var STEP = 7, GAP = 6, FLY = 850;

  var canvas = document.getElementById("c");
  var ctx = canvas.getContext("2d");
  var reduced = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  if (reduced){ GAP = 1; FLY = 220; }

  var svgNS = "http://www.w3.org/2000/svg";
  var svg = document.createElementNS(svgNS, "svg");
  svg.setAttribute("width","0"); svg.setAttribute("height","0");
  svg.style.position="absolute"; svg.style.opacity="0"; svg.style.pointerEvents="none";
  document.body.appendChild(svg);

  var strokes = [], points = [], order = 0;
  FIGURE.forEach(function(item){
    var p = document.createElementNS(svgNS,"path");
    p.setAttribute("d", item.d);
    svg.appendChild(p);
    var len = p.getTotalLength();
    var n = Math.max(2, Math.round(len / STEP));
    var list = [];
    for (var i = 0; i <= n; i++){
      var q = p.getPointAtLength(len * i / n);
      var a = Math.random()*Math.PI*2, r = 380 + Math.random()*480;
      list.push({x:q.x, y:q.y, sx:300+Math.cos(a)*r, sy:400+Math.sin(a)*r*0.8,
                 ph:Math.random()*6.283, cx:0, cy:0, t:0, at:order*GAP});
      order++;
    }
    svg.removeChild(p);
    strokes.push({g:item.g, pts:list});
    points = points.concat(list);
  });

  // golden-hour bokeh and marigold petals
  var bokeh = [], petals = [];
  for (var i=0;i<34;i++) bokeh.push({x:Math.random(),y:Math.random(),r:18+Math.random()*72,
    ph:Math.random()*6.283,sp:.1+Math.random()*.25,h:Math.random()<.35?"255,120,60":"255,190,90"});
  for (i=0;i<26;i++) petals.push({x:Math.random(),y:Math.random(),s:2+Math.random()*4,
    ph:Math.random()*6.283,sp:.15+Math.random()*.35});

  var dpr=1,W=0,H=0,scale=1,ox=0,oy=0;
  function resize(){
    dpr = Math.min(window.devicePixelRatio||1, 2);
    W = canvas.clientWidth; H = canvas.clientHeight;
    canvas.width = Math.round(W*dpr); canvas.height = Math.round(H*dpr);
    ctx.setTransform(dpr,0,0,dpr,0,0);
    scale = Math.min(W/VB_W, H/VB_H) * (H > W ? 0.84 : 0.92);
    ox = (W - VB_W*scale)/2;
    oy = (H - VB_H*scale)/2 - H*0.035;
  }
  window.addEventListener("resize", resize);
  resize();

  function X(v){return ox+v*scale}
  function Y(v){return oy+v*scale}
  function ease(t){return 1-Math.pow(1-t,3)}

  var start = performance.now(), finished = false;

  function frame(now){
    var elapsed = now - start;
    ctx.clearRect(0,0,W,H);

    // sunset bokeh
    bokeh.forEach(function(b){
      var y = ((b.y - (now/60000)*b.sp) % 1 + 1) % 1;
      var g = ctx.createRadialGradient(b.x*W, y*H, 0, b.x*W, y*H, b.r);
      var a = 0.05 + 0.05*Math.sin(now/2600 + b.ph);
      g.addColorStop(0,"rgba("+b.h+","+(a+0.06)+")");
      g.addColorStop(.6,"rgba("+b.h+","+(a*0.5)+")");
      g.addColorStop(1,"rgba("+b.h+",0)");
      ctx.fillStyle = g;
      ctx.beginPath(); ctx.arc(b.x*W, y*H, b.r, 0, 6.283); ctx.fill();
    });

    // low sun
    var sg = ctx.createRadialGradient(W*.5,H*.30,0,W*.5,H*.30,Math.max(W,H)*.42);
    sg.addColorStop(0,"rgba(255,196,120,.16)");
    sg.addColorStop(1,"rgba(255,196,120,0)");
    ctx.fillStyle = sg; ctx.fillRect(0,0,W,H);

    var breathe = .5 + .5*Math.sin(now/1800);
    var allDone = true;

    ctx.lineCap="round"; ctx.lineJoin="round";

    strokes.forEach(function(s){
      var col = COLORS[s.g], rgb = col[0]+","+col[1]+","+col[2];
      var pts = s.pts, i, p;

      for (i=0;i<pts.length;i++){
        p = pts[i];
        var k = (elapsed - p.at)/FLY;
        k = k<0?0:(k>1?1:k);
        p.t = k;
        if (k<1) allDone = false;
        var e = ease(k);
        var sway = k===1 ? Math.sin(now/2200 + p.ph)*0.9 : 0;
        p.cx = X(p.sx + (p.x-p.sx)*e + sway);
        p.cy = Y(p.sy + (p.y-p.sy)*e + sway*0.6);
      }

      ctx.strokeStyle = "rgba("+rgb+","+(0.55+0.2*breathe)+")";
      ctx.lineWidth = Math.max(1, scale*(s.g===4?1.3:1.7));
      ctx.shadowColor = "rgba("+rgb+",.6)";
      ctx.shadowBlur = 13*scale;
      for (i=1;i<pts.length;i++){
        var a2 = pts[i-1], b2 = pts[i];
        if (b2.t <= 0) break;
        ctx.beginPath();
        ctx.moveTo(a2.cx, a2.cy);
        ctx.lineTo(a2.cx + (b2.cx-a2.cx)*b2.t, a2.cy + (b2.cy-a2.cy)*b2.t);
        ctx.stroke();
      }
      ctx.shadowBlur = 0;

      for (i=0;i<pts.length;i++){
        p = pts[i];
        if (p.t <= 0) continue;
        var r = Math.max(.9, scale*(1.5 + (1-p.t)*2.4));
        ctx.fillStyle = "rgba("+rgb+","+(0.35+0.5*p.t)+")";
        ctx.beginPath(); ctx.arc(p.cx,p.cy,r,0,6.283); ctx.fill();
        if (p.t===1 && i%6===0){
          ctx.fillStyle = "rgba("+rgb+","+(0.10+0.10*breathe)+")";
          ctx.beginPath(); ctx.arc(p.cx,p.cy,r*3.4,0,6.283); ctx.fill();
        }
      }
    });

    // marigold petals drifting in front
    petals.forEach(function(f){
      var y = ((f.y - (now/40000)*f.sp) % 1 + 1) % 1;
      var x = f.x*W + Math.sin(now/3000 + f.ph)*14;
      ctx.fillStyle = "rgba(255,168,74,"+(0.18+0.14*Math.sin(now/1700+f.ph))+")";
      ctx.beginPath(); ctx.ellipse(x, y*H, f.s*1.6, f.s, f.ph, 0, 6.283); ctx.fill();
    });

    if (allDone && !finished){ finished = true; document.body.classList.add("done"); }
    requestAnimationFrame(frame);
  }

  function replay(){
    document.body.classList.remove("done");
    finished = false;
    points.forEach(function(p){
      var a = Math.random()*Math.PI*2, r = 380 + Math.random()*480;
      p.sx = 300 + Math.cos(a)*r;
      p.sy = 400 + Math.sin(a)*r*0.8;
      p.t = 0;
    });
    start = performance.now();
  }
  document.getElementById("again").addEventListener("click", replay);

  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
